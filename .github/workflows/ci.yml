name: offline-checks

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: pip install "mcp[cli]>=1.4.1,<2"
      - name: Offline tests (no Substance Designer needed)
        run: python -m unittest tests/test_offline.py -v
